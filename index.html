<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side B — An Interactive Short Story</title>
    <link rel="icon" href="./public/favicon.svg" />

    <!-- Google Font Comfortaa (400, 500, 600, 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Import Map — serves via python3 -m http.server 8000 -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
    </script>

    <style>
      /* ── Reset & Global Comfortaa Font ─────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Comfortaa', cursive, sans-serif !important;
      }
      body {
        overflow: hidden;
        background: #140f13;
        font-family: 'Comfortaa', cursive, sans-serif !important;
        color: #f7f1ec;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea, select {
        font-family: 'Comfortaa', cursive, sans-serif !important;
      }

      /* ── Crosshair ─────────────────────────────────────── */
      #crosshair {
        position: fixed; top: 50%; left: 50%;
        width: 7px; height: 7px;
        background: rgba(255, 245, 248, 0.9);
        border: none; border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; z-index: 20;
        transition: all 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }
      #crosshair.active {
        width: 26px; height: 26px;
        background: transparent;
        border: 2px solid #f3a7bb;
        box-shadow: 0 0 16px rgba(243, 167, 187, 0.6);
      }

      /* ── Interaction Prompt ────────────────────────────── */
      #prompt {
        position: fixed; top: 55%; left: 50%;
        transform: translateX(-50%);
        background: rgba(28, 20, 26, 0.88);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 10px 22px; border-radius: 20px;
        border: 1px solid rgba(243, 167, 187, 0.4);
        font-size: 13.5px; font-weight: 600; letter-spacing: 0.5px;
        color: #fcebef;
        display: none; pointer-events: none;
        z-index: 20;
        box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      }

      /* ── Title Screen Overlay ──────────────────────────── */
      #start-overlay {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at 50% 45%, rgba(42, 28, 36, 0.96), rgba(16, 11, 15, 0.99));
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 50; cursor: default;
        text-align: center;
        padding: 24px;
        pointer-events: auto;
      }
      #start-overlay .title {
        font-size: 78px; font-weight: 700;
        letter-spacing: 14px; text-transform: uppercase;
        color: #fcecf1;
        text-shadow: 0 0 45px rgba(243, 167, 187, 0.35), 0 2px 10px rgba(0,0,0,0.7);
        margin-bottom: 12px;
        animation: titleGlow 4s ease-in-out infinite alternate;
      }
      @keyframes titleGlow {
        0% { text-shadow: 0 0 30px rgba(243,167,187,0.2), 0 2px 8px rgba(0,0,0,0.7); }
        100% { text-shadow: 0 0 60px rgba(243,167,187,0.5), 0 2px 12px rgba(0,0,0,0.7); }
      }
      #start-overlay .subtitle {
        font-size: 20px; font-weight: 500;
        color: #e8b0be; letter-spacing: 3px; text-transform: uppercase;
        margin-bottom: 34px;
        opacity: 0.95;
      }
      #start-overlay .credits {
        font-size: 14.5px; font-weight: 500;
        color: #f0c2cf; letter-spacing: 1.2px;
        margin-top: -20px;
        margin-bottom: 36px;
        opacity: 0.92;
      }
      #start-overlay .controls-guide {
        font-size: 13px; color: #a48c94;
        letter-spacing: 0.8px; margin-bottom: 36px;
        line-height: 2.0;
      }
      #start-overlay .controls-guide span {
        color: #edd2da;
        background: rgba(243, 167, 187, 0.12);
        border: 1px solid rgba(243, 167, 187, 0.3);
        padding: 4px 10px; border-radius: 6px;
        font-size: 12px; font-weight: 600;
      }
      #start-overlay .enter-btn {
        font-size: 16px; color: #ffffff;
        letter-spacing: 2.5px; text-transform: uppercase;
        padding: 15px 48px;
        border: 1px solid rgba(243, 167, 187, 0.6);
        border-radius: 25px;
        background: rgba(243, 167, 187, 0.2);
        transition: all 0.3s ease;
        animation: enterPulse 3s ease-in-out infinite;
        font-weight: 700;
        cursor: pointer;
        outline: none;
      }
      #start-overlay .enter-btn:hover {
        background: rgba(243, 167, 187, 0.35);
        border-color: rgba(255, 200, 220, 0.9);
        box-shadow: 0 0 28px rgba(243, 167, 187, 0.4);
        transform: translateY(-2px);
      }
      @keyframes enterPulse {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; }
      }

      /* ── Canvas ────────────────────────────────────────── */
      canvas { display: block; }
    </style>
  </head>

  <body>
    <!-- Crosshair & Interaction Prompt -->
    <div id="crosshair"></div>
    <div id="prompt">[E] Inspect</div>

    <!-- Title Screen -->
    <div id="start-overlay">
      <div class="title">SIDE B</div>
      <div class="subtitle">An Interactive Short Story</div>
      <div class="credits">Made by Ishaan Pai and Srikara Pramod</div>
      <div class="controls-guide">
        <span>WASD</span> Move &nbsp;&bull;&nbsp;
        <span>Mouse</span> Look &nbsp;&bull;&nbsp;
        <span>E</span> Inspect / Pick Up &nbsp;&bull;&nbsp;
        <span>Tab</span> Detective Board
      </div>
      <button class="enter-btn" id="sb-title-begin-btn">Begin</button>
    </div>

    <!-- Error Monitoring & Preview Support -->
    <script>
      window.__sb_errors = [];
      window.addEventListener('error', (e) => {
        window.__sb_errors.push(e.message || String(e));
        if (window.location.hash.includes('capture')) {
          fetch('/_report_log', { method: 'POST', body: '[ERROR] ' + (e.message || String(e)) }).catch(() => {});
        }
      });
      window.addEventListener('unhandledrejection', (e) => {
        const msg = e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled rejection';
        window.__sb_errors.push(msg);
        if (window.location.hash.includes('capture')) {
          fetch('/_report_log', { method: 'POST', body: '[ERROR] ' + msg }).catch(() => {});
        }
      });
      if (window.location.hash.includes('capture')) {
        const origLog = console.log;
        const origErr = console.error;
        console.log = function(...args) {
          origLog.apply(console, args);
          fetch('/_report_log', { method: 'POST', body: '[LOG] ' + args.join(' ') }).catch(() => {});
        };
        console.error = function(...args) {
          origErr.apply(console, args);
          fetch('/_report_log', { method: 'POST', body: '[ERROR] ' + args.join(' ') }).catch(() => {});
        };
      }
      if (window.location.hash.includes('preview') || window.location.search.includes('preview')) {
        const overlay = document.getElementById('start-overlay');
        if (overlay) overlay.style.display = 'none';
      }

      if (window.location.hash.includes('test_suite')) {
        window.addEventListener('load', async () => {
          while (!document.body.getAttribute('data-status')) {
            await new Promise(r => setTimeout(r, 200));
          }
          await new Promise(r => setTimeout(r, 500));

          const res = { tests: [] };

          // 1. Title subtitle and credits
          const subtitle = document.querySelector('#start-overlay .subtitle')?.textContent?.trim();
          const credits = document.querySelector('#start-overlay .credits')?.textContent?.trim();
          res.tests.push({
            name: 'Title Screen Subtitle & Credits',
            passed: subtitle === 'An Interactive Short Story' && credits === 'Made by Ishaan Pai and Srikara Pramod',
            details: { subtitle, credits }
          });

          const story = window.__storyController;
          const state = window.__gameState;

          // 2. Torn Counselor Card Puzzle
          story.inspectClue('trash_can');
          const puzzleOpen = state.activeModal === 'card_puzzle';
          const puzzleModal = document.getElementById('sb-card-puzzle-modal');
          const puzzleVisible = puzzleModal && getComputedStyle(puzzleModal).display !== 'none';
          const scraps = document.querySelectorAll('.sb-card-scrap');
          res.tests.push({
            name: 'Inspect trash_can opens Card Puzzle Modal',
            passed: puzzleOpen && puzzleVisible && scraps.length === 5,
            details: { puzzleOpen, puzzleVisible, scrapsCount: scraps.length }
          });

          // Test completion of puzzle by simulating solve
          const completeBtn = document.getElementById('sb-card-complete-btn');
          const banner = document.getElementById('sb-card-complete-banner');
          banner.style.display = 'block';
          state.cardPuzzleSolved = true;
          state.foundClinicCard = true;
          completeBtn.click();
          res.tests.push({
            name: 'Card puzzle solved sets state and adds to detective board',
            passed: state.cardPuzzleSolved && state.foundClinicCard,
            details: { cardPuzzleSolved: state.cardPuzzleSolved, foundClinicCard: state.foundClinicCard }
          });

          // 3. Wardrobe & Brass key in mug & immediate Tape 3 grant
          const initialKey = state.hasClosetKey;
          const dialogueText = document.getElementById('sb-dialogue-text');
          const dialogueBox = document.getElementById('sb-dialogue-box');
          story.inspectClue('closet'); // should fail to open without key
          if (dialogueBox) dialogueBox.click(); // complete typewriter text
          const closedDialogue = dialogueText?.textContent?.includes("wardrobe door is latched shut");
          const tape3BeforeKey = state.collectedTapes[3];

          story.inspectClue('mug'); // should discover brass key
          if (dialogueBox) dialogueBox.click();
          const keyFound = state.hasClosetKey;

          story.inspectClue('closet'); // should unlock wardrobe & immediately grant Tape 3
          if (dialogueBox) dialogueBox.click();
          const tape3Collected = state.collectedTapes[3];
          const tape3Btn = document.getElementById('sb-tape-btn-3');
          const tape3UnlockedInModal = tape3Btn && !tape3Btn.disabled;
          res.tests.push({
            name: 'Wardrobe: latched shut dialogue without key, immediately grants Tape 3 with key',
            passed: !initialKey && closedDialogue && !tape3BeforeKey && keyFound && tape3Collected && tape3UnlockedInModal,
            details: { initialKey, closedDialogue, keyFound, tape3Collected, tape3UnlockedInModal }
          });

          // 4. Keepsake box 1-0-4 unlock & immediate Side B tape grant & climax
          const dial0 = document.getElementById('sb-dial-0');
          const dial1 = document.getElementById('sb-dial-1');
          const dial2 = document.getElementById('sb-dial-2');
          const unlockBtn = document.getElementById('sb-btn-unlock');

          // Dial 1-0-4
          dial0.click(); // 1
          // dial1 is already 0
          for (let i = 0; i < 4; i++) dial2.click(); // 4
          unlockBtn.click();

          const boxUnlocked = state.boxUnlocked;
          const hasSideBTape = state.hasSideBTape;
          const objText = document.getElementById('sb-objective-text')?.textContent;
          const expectedObj = "Objective: Place the blank Side B tape into the cassette player on the desk";
          const objMatched = objText === expectedObj;

          story.inspectClue('tape_player');
          const recordOpen = state.activeModal === 'record';
          const recordModal = document.getElementById('sb-record-modal');
          const recordVisible = recordModal && getComputedStyle(recordModal).display !== 'none';
          const slider = document.getElementById('sb-balance-slider');
          slider.value = 70;
          slider.dispatchEvent(new Event('input'));
          const balanceText = document.getElementById('sb-balance-display')?.textContent?.trim();

          // Simulate 2s hold in update
          story.update(2.1, false, true);
          const endingTriggered = state.gameCompleted && state.activeModal === 'ending';
          res.tests.push({
            name: 'Keepsake Box: 1-0-4 sets boxUnlocked & hasSideBTape, updates objective, launches Side B climax',
            passed: boxUnlocked && hasSideBTape && objMatched && recordOpen && recordVisible && balanceText === '30% / 70%' && endingTriggered,
            details: { boxUnlocked, hasSideBTape, objText, recordOpen, recordVisible, endingTriggered }
          });

          fetch('/_report_test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(res)
          }).catch(() => {});
        });
      }
    </script>

    <!-- Game Entry Point -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
